services:
  metacleaner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: metacleaner
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=metacleaner-secure-random-token
      - FORCE_HTTPS=false
    read_only: false
    security_opt:
      - no-new-privileges:true
