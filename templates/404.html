{% extends 'base.html' %}

    <div class="page-header" style="text-align: center;">
        <h1 class="page-title" style="font-size: 4rem; margin-bottom: 8px;">404</h1>

    <div class="page-actions" style="justify-content: center; margin-top: 24px;">

    </div>
</div>
{% endblock %}
